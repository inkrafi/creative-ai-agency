name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agency_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/agency_dev?schema=public
      DATABASE_URL: postgresql://app_rls:change_me@localhost:5432/agency_dev?schema=public
      DATABASE_URL_AUTH_BYPASS: postgresql://app_auth_bypass:change_me_too@localhost:5432/agency_dev?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_test_secret
      JWT_EXPIRES_IN: 1d
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations (tables + RLS policies)
        run: pnpm --filter api prisma:deploy

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Run unit tests
        run: pnpm --filter api test

      - name: Run e2e tests (isolation, auth, credit ledger, briefs/generation, image generation)
        run: pnpm --filter api test:e2e
